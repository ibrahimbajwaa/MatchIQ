server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API lives in the backend container; the browser only ever talks to this origin, so there is no CORS to configure.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
  }

  # Hashed build assets never change, so browsers can keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path is a client-side route.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
